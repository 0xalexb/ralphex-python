name: Build and Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: build-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve-versions:
    runs-on: ubuntu-latest
    outputs:
      repo_version: ${{ steps.repo-version.outputs.version }}
      repo_tag: ${{ steps.repo-version.outputs.tag }}
      ralphex_version: ${{ steps.ralphex-version.outputs.version }}
      claude_code_version: ${{ steps.claude-code-version.outputs.version }}
      codex_version: ${{ steps.codex-version.outputs.version }}
      uv_version: ${{ steps.uv-version.outputs.version }}
      composer_version: ${{ steps.composer-version.outputs.version }}
      phpstan_version: ${{ steps.phpstan-version.outputs.version }}
      go_version: ${{ steps.go-version.outputs.version }}
      pi_version: ${{ steps.pi-version.outputs.version }}
    steps:
      - name: Resolve repo version
        id: repo-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Workflow is tag-triggered; github.ref_name is the pushed tag.
          TAG="${REF_NAME}"
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve repo version"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve ralphex version
        id: ralphex-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RALPHEX_VERSION: ${{ inputs.ralphex_version }}
        run: |
          if [ -n "${INPUT_RALPHEX_VERSION}" ]; then
            TAG="${INPUT_RALPHEX_VERSION}"
          else
            TAG=$(gh api "repos/umputun/ralphex/releases/latest" --jq '.tag_name')
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve ralphex version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve Claude Code version
        id: claude-code-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
        run: |
          if [ -n "${INPUT_CLAUDE_CODE_VERSION}" ]; then
            TAG="${INPUT_CLAUDE_CODE_VERSION}"
          else
            TAG=$(gh api "repos/anthropics/claude-code/releases/latest" --jq '.tag_name')
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve Claude Code version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve Codex version
        id: codex-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CODEX_VERSION: ${{ inputs.codex_version }}
        run: |
          if [ -n "${INPUT_CODEX_VERSION}" ]; then
            TAG="${INPUT_CODEX_VERSION}"
          else
            TAG=$(npm view @openai/codex version 2>/dev/null || true)
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve Codex version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve UV version
        id: uv-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_UV_VERSION: ${{ inputs.uv_version }}
        run: |
          if [ -n "${INPUT_UV_VERSION}" ]; then
            TAG="${INPUT_UV_VERSION}"
          else
            TAG=$(gh api "repos/astral-sh/uv/releases/latest" --jq '.tag_name')
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve UV version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve Composer version
        id: composer-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_COMPOSER_VERSION: ${{ inputs.composer_version }}
        run: |
          if [ -n "${INPUT_COMPOSER_VERSION}" ]; then
            TAG="${INPUT_COMPOSER_VERSION}"
          else
            # Skip pre-release/RC versions
            TAG=$(gh api "repos/composer/composer/releases" --jq '[.[] | select(.prerelease == false) | .tag_name] | .[0]')
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve Composer version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve PHPStan version
        id: phpstan-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PHPSTAN_VERSION: ${{ inputs.phpstan_version }}
        run: |
          if [ -n "${INPUT_PHPSTAN_VERSION}" ]; then
            TAG="${INPUT_PHPSTAN_VERSION}"
          else
            TAG=$(gh api "repos/phpstan/phpstan/releases/latest" --jq '.tag_name')
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve PHPStan version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve Go version
        id: go-version
        env:
          INPUT_GO_VERSION: ${{ inputs.go_version }}
        run: |
          if [ -n "${INPUT_GO_VERSION}" ]; then
            VERSION="${INPUT_GO_VERSION#v}"
          else
            VERSION=$(curl -sL 'https://go.dev/dl/?mode=json' | jq -r '.[0].version' | sed 's/^go//')
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::Failed to resolve Go version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve Pi version
        id: pi-version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PI_VERSION: ${{ inputs.pi_version }}
        run: |
          if [ -n "${INPUT_PI_VERSION}" ]; then
            TAG="${INPUT_PI_VERSION}"
          else
            TAG=$(gh api "repos/earendil-works/pi/releases/latest" --jq '.tag_name')
          fi
          if [ -z "${TAG}" ]; then
            echo "::error::Failed to resolve Pi version"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  # Each architecture is built on its own native runner (amd64 on ubuntu-latest,
  # arm64 on ubuntu-24.04-arm) and pushed by digest. Native builds avoid QEMU
  # emulation, which intermittently crashed the npm install steps with
  # "Illegal instruction (core dumped)" (SIGILL, exit 132) and caused constant
  # multi-arch build failures. The per-arch digests are combined into a single
  # multi-arch manifest in the matching merge-* job.
  build-python:
    needs: resolve-versions
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-versions.outputs.repo_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-python/
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/0xalexb/ralphex-python,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PYTHON_VERSION=${{ matrix.python_version }}
            RALPHEX_VERSION=${{ needs.resolve-versions.outputs.ralphex_version }}
            UV_VERSION=${{ needs.resolve-versions.outputs.uv_version }}
            CLAUDE_CODE_VERSION=${{ needs.resolve-versions.outputs.claude_code_version }}
            CODEX_VERSION=${{ needs.resolve-versions.outputs.codex_version }}
            PI_VERSION=${{ needs.resolve-versions.outputs.pi_version }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-python-${{ matrix.python_version }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-python:
    needs: [resolve-versions, build-python]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-python-${{ matrix.python_version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag flags
        id: tags
        env:
          REPO_VER: ${{ needs.resolve-versions.outputs.repo_version }}
          RALPHEX_VER: ${{ needs.resolve-versions.outputs.ralphex_version }}
          PY_VER: ${{ matrix.python_version }}
        run: |
          IMAGE="ghcr.io/0xalexb/ralphex-python"

          FLAGS="-t ${IMAGE}:${REPO_VER}-r${RALPHEX_VER}-py${PY_VER}"
          FLAGS="${FLAGS} -t ${IMAGE}:r${RALPHEX_VER}-py${PY_VER}"
          FLAGS="${FLAGS} -t ${IMAGE}:py${PY_VER}"
          if [ "${PY_VER}" = "3.13" ]; then
            FLAGS="${FLAGS} -t ${IMAGE}:latest"
          fi

          echo "flags=${FLAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.flags }} \
            $(printf '${{ steps.tags.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ steps.tags.outputs.image }}:${{ needs.resolve-versions.outputs.repo_version }}-r${{ needs.resolve-versions.outputs.ralphex_version }}-py${{ matrix.python_version }}"

  build-go:
    needs: resolve-versions
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-versions.outputs.repo_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-go/
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/0xalexb/ralphex-go,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=go-${{ matrix.platform.arch }}
          cache-to: type=gha,scope=go-${{ matrix.platform.arch }},mode=max
          build-args: |
            RALPHEX_VERSION=${{ needs.resolve-versions.outputs.ralphex_version }}
            GO_VERSION=${{ needs.resolve-versions.outputs.go_version }}
            CLAUDE_CODE_VERSION=${{ needs.resolve-versions.outputs.claude_code_version }}
            CODEX_VERSION=${{ needs.resolve-versions.outputs.codex_version }}
            PI_VERSION=${{ needs.resolve-versions.outputs.pi_version }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-go-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-go:
    needs: [resolve-versions, build-go]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-go-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag flags
        id: tags
        env:
          REPO_VER: ${{ needs.resolve-versions.outputs.repo_version }}
          RALPHEX_VER: ${{ needs.resolve-versions.outputs.ralphex_version }}
        run: |
          IMAGE="ghcr.io/0xalexb/ralphex-go"

          FLAGS="-t ${IMAGE}:${REPO_VER}-r${RALPHEX_VER}"
          FLAGS="${FLAGS} -t ${IMAGE}:r${RALPHEX_VER}"
          FLAGS="${FLAGS} -t ${IMAGE}:latest"

          echo "flags=${FLAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.flags }} \
            $(printf '${{ steps.tags.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ steps.tags.outputs.image }}:${{ needs.resolve-versions.outputs.repo_version }}-r${{ needs.resolve-versions.outputs.ralphex_version }}"

  build-php:
    needs: resolve-versions
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4", "8.5"]
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.resolve-versions.outputs.repo_tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: docker-php/
          platforms: linux/${{ matrix.platform.arch }}
          outputs: type=image,name=ghcr.io/0xalexb/ralphex-php,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
            RALPHEX_VERSION=${{ needs.resolve-versions.outputs.ralphex_version }}
            COMPOSER_VERSION=${{ needs.resolve-versions.outputs.composer_version }}
            PHPSTAN_VERSION=${{ needs.resolve-versions.outputs.phpstan_version }}
            CLAUDE_CODE_VERSION=${{ needs.resolve-versions.outputs.claude_code_version }}
            CODEX_VERSION=${{ needs.resolve-versions.outputs.codex_version }}
            PI_VERSION=${{ needs.resolve-versions.outputs.pi_version }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-php-${{ matrix.php_version }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-php:
    needs: [resolve-versions, build-php]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php_version: ["8.3", "8.4", "8.5"]
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-php-${{ matrix.php_version }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tag flags
        id: tags
        env:
          REPO_VER: ${{ needs.resolve-versions.outputs.repo_version }}
          RALPHEX_VER: ${{ needs.resolve-versions.outputs.ralphex_version }}
          PHP_VER: ${{ matrix.php_version }}
        run: |
          IMAGE="ghcr.io/0xalexb/ralphex-php"

          FLAGS="-t ${IMAGE}:${REPO_VER}-r${RALPHEX_VER}-php${PHP_VER}"
          FLAGS="${FLAGS} -t ${IMAGE}:r${RALPHEX_VER}-php${PHP_VER}"
          FLAGS="${FLAGS} -t ${IMAGE}:php${PHP_VER}"
          if [ "${PHP_VER}" = "8.5" ]; then
            FLAGS="${FLAGS} -t ${IMAGE}:latest"
          fi

          echo "flags=${FLAGS}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.flags }} \
            $(printf '${{ steps.tags.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect "${{ steps.tags.outputs.image }}:${{ needs.resolve-versions.outputs.repo_version }}-r${{ needs.resolve-versions.outputs.ralphex_version }}-php${{ matrix.php_version }}"
